name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_HOME: ${{ runner.temp }}/.pnpm
  NODE_ENV: test

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -s lint

      - name: Typecheck
        run: pnpm -s typecheck

      - name: Build
        run: pnpm -s build

      - name: Unit tests (JUnit)
        run: pnpm -s test:junit
        continue-on-error: false

      - name: Coverage (V8)
        run: pnpm -s test:coverage

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: reports/junit.xml
          if-no-files-found: warn

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-coverage
          path: coverage
          if-no-files-found: warn

      - name: License check
        run: pnpm -s license:check

  security_scan:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Install OSV-Scanner (stable latest)
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          case "$(uname -m)" in
            x86_64|amd64) OSV_ARCH="amd64" ;;
            aarch64|arm64) OSV_ARCH="arm64" ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSfL -o "$BIN_DIR/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_${OSV_ARCH}"
          chmod +x "$BIN_DIR/osv-scanner"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          osv-scanner --version

      - name: Run OSV-Scanner (repo + lockfile)
        shell: bash
        run: |
          set -euo pipefail
          osv-scanner -r . --format sarif -o osv.sarif

      - name: Upload OSV SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif
